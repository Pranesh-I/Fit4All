name: sai_sports_auth
description: SAI Sports Talent Assessment - Authentication System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # HTTP Client
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0

  # Face Detection & ML
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.12.1
  camera: ^0.10.5+9
  image: ^4.2.0

  # UI
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  dropdown_search: ^5.0.6
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utilities
  uuid: ^4.4.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/models/
